name: Codecov

concurrency:
  group: codecov-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  run:
    name: Codecov
    environment:
      name: codecov
      url: https://app.codecov.io/gh/NatLabRockies/reV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Setup Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.11
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest-cov
        python -m pip install ".[bespoke,test]"
    - name: Generate coverage report
      run: |
        python -m  pytest --disable-warnings --cov=./ --cov-branch --cov-report=xml:coverage.xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7.1.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        env_vars: OS,PYTHON
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
